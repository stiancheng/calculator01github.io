<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工务段综合工具箱</title>
    <style>
        * { box-sizing: border-box; font-family: "微软雅黑", Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff; margin: 0; padding: 10px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        /* 顶部导航栏 */
        .nav-container {
            width: 100%; max-width: 600px;
            display: flex; gap: 5px; margin-bottom: 15px;
        }
        .nav-btn {
            flex: 1; padding: 12px 5px; border: none; border-radius: 8px;
            background: rgba(255, 255, 255, 0.2); color: white;
            font-size: 14px; cursor: pointer; transition: 0.3s;
        }
        .nav-btn.active { background: #ffcc00; color: #333; font-weight: bold; }

        .main-card {
            width: 100%; max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px; padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            display: none; /* 默认隐藏，通过JS控制显示 */
        }
        .main-card.active { display: block; animation: fadeIn 0.4s ease; }

        h2 { font-size: 20px; margin-top: 0; color: #ffcc00; text-align: center; }
        label { font-size: 14px; margin-bottom: 5px; display: block; margin-top: 10px;}
        input {
            width: 100%; padding: 10px; margin: 5px 0;
            border: 2px solid #fff; border-radius: 8px; outline: none;
            background: rgba(255, 255, 255, 0.2); color: white; text-align: center;
        }
        input:focus { border-color: #ffcc00; }
        
        button.calc-btn {
            width: 100%; background: #ffcc00; color: #333; padding: 12px;
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
            cursor: pointer; margin-top: 15px;
        }

        /* 结果展示区 */
        .result-box {
            margin-top: 15px; padding: 12px; background: rgba(0, 0, 0, 0.3);
            border-radius: 10px; font-size: 14px; line-height: 1.6;
        }
        .bag-highlight { color: #00ffcc; font-weight: bold; }
        .loose-highlight { color: #ffbb00; }

        /* 表格样式 */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid rgba(255,255,255,0.2); padding: 8px; text-align: left; font-size: 13px;}
        th { background: rgba(255,255,255,0.1); color: #ffcc00; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="nav-container">
    <button class="nav-btn active" onclick="switchTab(0)">应力放散</button>
    <button class="nav-btn" onclick="switchTab(1)">换轨综合汇总</button>
    <button class="nav-btn" onclick="switchTab(2)">快速清料(袋)</button>
</div>

<!-- 1. 应力放散 -->
<div id="tab0" class="main-card active">
    <h2>🚄 应力放散计算器</h2>
    <label>设计锁定轨温 (°C)：</label>
    <input type="number" id="lockedTemp" value="31">
    <label>作业中轨温 (°C)：</label>
    <input type="number" id="workingTemp" placeholder="输入当前轨温">
    <label>轨长 (m)：</label>
    <input type="number" id="trackLength" placeholder="输入总轨长">
    <label>锁定轨长 (m)：</label>
    <input type="number" id="lockedTrackLength" value="50">
    <button class="calc-btn" onclick="calcStress()">💡 计算放散量</button>
    <div id="stressResult" class="result-box" style="display:none;"></div>
</div>

<!-- 2. 换轨汇总 (原功能) -->
<div id="tab1" class="main-card">
    <h2>🛤️ 综合材料汇总</h2>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <div><label>Ⅱ型枕</label><input type="number" id="type2" value="0"></div>
        <div><label>Ⅱq桥枕</label><input type="number" id="type2q" value="0"></div>
        <div><label>ⅢA型枕</label><input type="number" id="type3A" value="0"></div>
        <div><label>Ⅲq桥枕</label><input type="number" id="type3q" value="0"></div>
        <div><label>XⅢ型枕</label><input type="number" id="typeX3" value="0"></div>
        <div><label>Ⅲb型枕</label><input type="number" id="type3b" value="0"></div>
    </div>
    <button class="calc-btn" onclick="calcTotalMaterials()">🧮 计算总数</button>
    <div id="totalResult" class="result-box" style="display:none;"></div>
</div>

<!-- 3. 快速清料 (新功能：袋装模式) -->
<div id="tab2" class="main-card">
    <h2>📦 快速清料（袋装计算）</h2>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div>
            <label>ⅢA型枕 (根)</label>
            <input type="number" id="clear3A" value="0" onfocus="this.select()">
        </div>
        <div>
            <label>桥枕 (根)</label>
            <input type="number" id="clearBridge" value="0" onfocus="this.select()">
        </div>
    </div>
    <button class="calc-btn" onclick="calcBags()">📦 按袋核料</button>
    
    <div id="bagResult" class="result-box" style="display:none;">
        <div style="text-align:center; margin-bottom:10px; font-weight:bold;">总枕木：<span id="totalSleeperCount">0</span> 根</div>
        <table>
            <thead>
                <tr><th>材料</th><th>总数</th><th>配货(袋+个)</th></tr>
            </thead>
            <tbody id="bagTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // 选项卡切换
    function switchTab(index) {
        document.querySelectorAll('.nav-btn').forEach((btn, i) => {
            btn.classList.toggle('active', i === index);
        });
        document.querySelectorAll('.main-card').forEach((card, i) => {
            card.classList.toggle('active', i === index);
        });
    }

    // 1. 应力放散逻辑
    function calcStress() {
        const lt = parseFloat(document.getElementById('lockedTemp').value);
        const wt = parseFloat(document.getElementById('workingTemp').value);
        const trackL = parseFloat(document.getElementById('trackLength').value);
        const lockL = parseFloat(document.getElementById('lockedTrackLength').value);
        if(isNaN(wt)||isNaN(trackL)) return alert("请填写完整");
        
        let real = trackL - lockL;
        let html = `<strong>计算结果：</strong><br>`;
        for (let i=100; i<=real; i+=100) {
            html += `📌 ${i}m: ${(0.0118*(lt-wt)*i).toFixed(2)} mm<br>`;
        }
        html += `📌 终点 ${real}m: ${(0.0118*(lt-wt)*real).toFixed(2)} mm`;
        const resDiv = document.getElementById('stressResult');
        resDiv.innerHTML = html; resDiv.style.display = 'block';
    }

    // 2. 换轨汇总逻辑 (保留你原来的)
    function calcTotalMaterials() {
        let t2=+document.getElementById('type2').value||0;
        let t2q=+document.getElementById('type2q').value||0;
        let t3A=+document.getElementById('type3A').value||0;
        let t3q=+document.getElementById('type3q').value||0;
        let tX3=+document.getElementById('typeX3').value||0;
        let t3b=+document.getElementById('type3b').value||0;
        let total = t2+t2q+t3A+t3q+tX3+t3b;
        
        let html = `<b>总枕木：${total} 根</b><hr>`;
        if(t3A+tX3 > 0) html += `ⅢA/XⅢ胶垫(10mm): ${(t3A+tX3)*2}个<br>`;
        if(t2q+t3q > 0) html += `桥枕胶垫(14mm): ${(t2q+t3q)*2}个<br>`;
        html += `弹条: ${total*4}个 | 螺帽: ${total*4}个`;
        
        const resDiv = document.getElementById('totalResult');
        resDiv.innerHTML = html; resDiv.style.display = 'block';
    }

    // 3. 快速清料逻辑 (新增加袋装换算)
    function calcBags() {
        const n3A = parseInt(document.getElementById('clear3A').value) || 0;
        const nBridge = parseInt(document.getElementById('clearBridge').value) || 0;
        const total = n3A + nBridge;
        if(total === 0) return;

        // 配置表：[名称, 每根枕木用量, 每袋规格, 类型(0通用, 1仅3A, 2仅桥)]
        const configs = [
            ["弹条", 4, 40, 0],
            ["大扣板", 2, 40, 0],
            ["小扣板", 2, 40, 0],
            ["挡座", 4, 500, 0],
            ["平垫", 4, 400, 0],
            ["螺帽", 4, 300, 0],
            ["10mm胶垫(ⅢA)", 2, 100, 1],
            ["14mm胶垫(桥)", 2, 50, 2]
        ];

        let tableHtml = "";
        configs.forEach(item => {
            let count = 0;
            if(item[3] === 0) count = total * item[1];
            else if(item[3] === 1) count = n3A * item[1];
            else if(item[3] === 2) count = nBridge * item[1];

            if(count > 0) {
                let bags = Math.floor(count / item[2]);
                let loose = count % item[2];
                let bagDesc = "";
                if(bags > 0) bagDesc += `<span class="bag-highlight">${bags}袋</span>`;
                if(loose > 0) bagDesc += (bags>0?"+":"") + `<span class="loose-highlight">${loose}个</span>`;
                
                tableHtml += `<tr><td>${item[0]}</td><td>${count}</td><td>${bagDesc}</td></tr>`;
            }
        });

        document.getElementById('totalSleeperCount').innerText = total;
        document.getElementById('bagTableBody').innerHTML = tableHtml;
        document.getElementById('bagResult').style.display = 'block';
    }
</script>

</body>
</html>
